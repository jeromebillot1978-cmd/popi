<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Fred Rénovation — Spot 40s</title>
<style>
  :root{
    --warm:#f5c98a; --warm2:#e8a35c; --dark:#1a1410; --cream:#fdf6ec;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#000;font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden}
  #stage{position:relative;width:100vw;height:100vh;background:#000;overflow:hidden}

  /* ===== SCÈNES ===== */
  .scene{position:absolute;inset:0;opacity:0;transition:opacity .8s ease;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .scene.active{opacity:1}

  /* Scène 1 : maison ancienne */
  #s1{background:linear-gradient(180deg,#2b2620 0%,#4a3f33 60%,#6b5a45 100%)}
  .house{position:relative;width:min(70vw,700px);height:min(50vh,400px);margin-top:6vh}
  .roof{position:absolute;top:0;left:50%;transform:translateX(-50%);width:0;height:0;border-left:min(35vw,350px) solid transparent;border-right:min(35vw,350px) solid transparent;border-bottom:min(18vh,140px) solid #3a2e24;filter:drop-shadow(0 0 30px rgba(245,201,138,.15))}
  .walls{position:absolute;top:min(18vh,140px);left:50%;transform:translateX(-50%);width:min(60vw,600px);height:min(30vh,240px);background:linear-gradient(180deg,#8a7760,#6b5a45);border:2px solid #3a2e24}
  .wall-crack{position:absolute;background:#3a2e24;opacity:.7}
  .window{position:absolute;width:22%;height:40%;background:#2b2620;border:3px solid #4a3f33;top:20%}
  .window.l{left:8%}.window.r{right:8%}
  .door{position:absolute;width:18%;height:55%;background:#3a2e24;bottom:0;left:50%;transform:translateX(-50%);border-radius:4px 4px 0 0}
  .dust{position:absolute;width:3px;height:3px;background:var(--warm);border-radius:50%;opacity:0;animation:dust 6s infinite}
  @keyframes dust{0%{opacity:0;transform:translateY(0)}20%{opacity:.8}100%{opacity:0;transform:translateY(-80px)}}

  /* Scène 2 : artisans (simulation stylisée) */
  #s2{background:linear-gradient(135deg,#3d3227,#5a4a38)}
  .toolbox{position:relative;width:min(60vw,500px);height:min(40vh,300px)}
  .tool{position:absolute;background:linear-gradient(90deg,#c9a961,#8a7340);border-radius:6px;box-shadow:0 8px 20px rgba(0,0,0,.4);animation:pulse 1.2s infinite alternate}
  .tool.h{width:60%;height:8%;top:30%;left:20%;transform:rotate(-15deg)}
  .tool.v{width:8%;height:55%;top:20%;left:48%;transform:rotate(8deg);animation-delay:.3s}
  .tool.d{width:70%;height:6%;top:65%;left:15%;transform:rotate(6deg);animation-delay:.6s}
  @keyframes pulse{from{filter:brightness(.9)}to{filter:brightness(1.3)}}
  .sawdust{position:absolute;inset:0;background:radial-gradient(circle at 50% 60%,rgba(245,201,138,.18),transparent 60%)}

  /* Scènes 3 : galerie rénovations */
  #s3{background:#1a1410}
  .gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:min(88vw,900px)}
  .card{aspect-ratio:4/3;border-radius:12px;position:relative;overflow:hidden;opacity:0;transform:scale(.9);transition:all .6s cubic-bezier(.2,.8,.2,1)}
  .card.show{opacity:1;transform:scale(1)}
  .card.bath{background:linear-gradient(160deg,#cfe3e8,#8fb8c4)}
  .card.kitchen{background:linear-gradient(160deg,#e8d5b7,#b8946a)}
  .card.floor{background:linear-gradient(160deg,#d4b48a,#9c7a52)}
  .card.paint{background:linear-gradient(160deg,#f5e6d3,#d9b896)}
  .card.insul{background:linear-gradient(160deg,#dfe8e0,#a8c0a8)}
  .card::after{content:attr(data-label);position:absolute;bottom:8px;left:10px;color:#1a1410;font-weight:600;font-size:13px;letter-spacing:.5px}

  /* Scène 4 : avant/après */
  #s4{background:#1a1410}
  .ba{position:relative;width:min(80vw,800px);height:min(50vh,420px);border-radius:16px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6)}
  .ba-layer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(20px,3vw,36px);font-weight:700;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.7)}
  .before{background:linear-gradient(135deg,#4a3f33,#2b2620);clip-path:inset(0 0 0 0)}
  .after{background:linear-gradient(135deg,#f5c98a,#e8a35c);clip-path:inset(0 100% 0 0);transition:clip-path 2.5s ease-in-out}
  .ba.play .after{clip-path:inset(0 0 0 0)}
  .ba-label{position:absolute;top:12px;padding:4px 14px;border-radius:20px;background:rgba(0,0,0,.55);color:#fff;font-size:13px;letter-spacing:1px}
  .ba-label.l{left:12px}.ba-label.r{right:12px}

  /* Scène 5 : clients satisfaits */
  #s5{background:linear-gradient(160deg,#f5e6d3,#e8c9a0)}
  .couple{display:flex;gap:min(8vw,80px);align-items:center}
  .person{width:min(18vw,140px);height:min(30vh,240px);background:linear-gradient(180deg,#5a4a38,#3d3227);border-radius:50% 50% 12px 12px;position:relative;animation:smile 1.6s ease-in-out infinite alternate}
  .person::before{content:'';position:absolute;top:-18%;left:50%;transform:translateX(-50%);width:70%;aspect-ratio:1;background:#d4b48a;border-radius:50%}
  .person::after{content:'😊';position:absolute;top:8%;left:50%;transform:translateX(-50%);font-size:clamp(24px,4vw,44px)}
  @keyframes smile{from{transform:translateY(0)}to{transform:translateY(-8px)}}

  /* Scène 6 : logo */
  #s6{background:radial-gradient(circle at 50% 40%,#2b2620,#0a0806)}
  .logo{text-align:center;opacity:0;transform:scale(.85);transition:all 1s cubic-bezier(.2,.8,.2,1)}
  .logo.show{opacity:1;transform:scale(1)}
  .logo h1{font-size:clamp(32px,6vw,72px);letter-spacing:4px;color:var(--warm);font-weight:800;text-shadow:0 0 40px rgba(245,201,138,.5)}
  .logo .tag{color:var(--cream);margin-top:14px;font-size:clamp(13px,1.6vw,20px);letter-spacing:2px}
  .logo .cta{margin-top:26px;display:inline-block;padding:12px 28px;border:2px solid var(--warm);border-radius:40px;color:var(--warm);font-size:clamp(13px,1.6vw,18px);letter-spacing:1px;background:rgba(245,201,138,.08)}
  .logo .site{margin-top:18px;color:rgba(253,246,236,.6);font-size:13px;letter-spacing:1px}
  .spark{position:absolute;width:4px;height:4px;background:var(--warm);border-radius:50%;opacity:0;animation:spark 3s infinite}
  @keyframes spark{0%,100%{opacity:0;transform:scale(0)}50%{opacity:1;transform:scale(1)}}

  /* ===== HUD ===== */
  #caption{position:absolute;bottom:8vh;left:50%;transform:translateX(-50%);color:#fff;font-size:clamp(18px,2.6vw,32px);font-weight:600;letter-spacing:1px;text-shadow:0 3px 20px rgba(0,0,0,.9);opacity:0;transition:opacity .5s;text-align:center;padding:0 20px}
  #caption.show{opacity:1}
  #hud{position:absolute;top:16px;right:16px;display:flex;gap:10px;z-index:100}
  #hud button{padding:10px 18px;border:none;border-radius:30px;background:rgba(245,201,138,.15);color:var(--warm);font-weight:600;cursor:pointer;backdrop-filter:blur(8px);border:1px solid rgba(245,201,138,.35);transition:all .2s}
  #hud button:hover{background:rgba(245,201,138,.3)}
  #hud button:disabled{opacity:.4;cursor:not-allowed}
  #progress{position:absolute;bottom:0;left:0;height:4px;background:linear-gradient(90deg,var(--warm),var(--warm2));width:0%;z-index:100;box-shadow:0 0 12px var(--warm)}
  #rec-dot{position:absolute;top:16px;left:16px;width:14px;height:14px;background:#e74c3c;border-radius:50%;opacity:0;z-index:100;animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.2}}
  #rec-dot.on{opacity:1}
</style>
</head>
<body>
<div id="stage">
  <!-- SCÈNE 1 -->
  <section class="scene active" id="s1">
    <div class="house">
      <div class="roof"></div>
      <div class="walls">
        <div class="window l"></div>
        <div class="window r"></div>
        <div class="door"></div>
      </div>
      <div class="dust" style="left:20%;top:60%;animation-delay:.3s"></div>
      <div class="dust" style="left:45%;top:40%;animation-delay:1.2s"></div>
      <div class="dust" style="left:70%;top:55%;animation-delay:2s"></div>
      <div class="dust" style="left:35%;top:70%;animation-delay:3s"></div>
      <div class="dust" style="left:60%;top:30%;animation-delay:4s"></div>
    </div>
  </section>

  <!-- SCÈNE 2 -->
  <section class="scene" id="s2">
    <div class="toolbox">
      <div class="tool h"></div>
      <div class="tool v"></div>
      <div class="tool d"></div>
      <div class="sawdust"></div>
    </div>
  </section>

  <!-- SCÈNE 3 -->
  <section class="scene" id="s3">
    <div class="gallery">
      <div class="card bath"    data-label="Salle de bain"></div>
      <div class="card kitchen" data-label="Cuisine"></div>
      <div class="card floor"   data-label="Sols neufs"></div>
      <div class="card paint"   data-label="Peinture"></div>
      <div class="card insul"   data-label="Isolation"></div>
    </div>
  </section>

  <!-- SCÈNE 4 -->
  <section class="scene" id="s4">
    <div class="ba" id="ba">
      <div class="ba-layer before">AVANT</div>
      <div class="ba-layer after">APRÈS</div>
      <div class="ba-label l">Avant</div>
      <div class="ba-label r">Après</div>
    </div>
  </section>

  <!-- SCÈNE 5 -->
  <section class="scene" id="s5">
    <div class="couple">
      <div class="person" style="animation-delay:.2s"></div>
      <div class="person" style="animation-delay:.6s"></div>
    </div>
  </section>

  <!-- SCÈNE 6 -->
  <section class="scene" id="s6">
    <div class="logo" id="logo">
      <h1>FRED RÉNOVATION</h1>
      <div class="tag">Travaux • Rénovation • Aménagement</div>
      <div class="cta">Demandez votre devis gratuit</div>
      <div class="site">fredrenovation.vercel.app</div>
    </div>
    <div class="spark" style="left:30%;top:35%;animation-delay:.5s"></div>
    <div class="spark" style="left:65%;top:45%;animation-delay:1.2s"></div>
    <div class="spark" style="left:45%;top:25%;animation-delay:2s"></div>
    <div class="spark" style="left:75%;top:60%;animation-delay:.8s"></div>
    <div class="spark" style="left:25%;top:65%;animation-delay:1.8s"></div>
  </section>

  <div id="caption"></div>
  <div id="progress"></div>
  <div id="rec-dot"></div>
  <div id="hud">
    <button id="play">▶ Lancer le spot</button>
    <button id="rec" disabled>● Enregistrer la vidéo</button>
  </div>
</div>

<script>
/* =========================================================
   TIMELINE (ms) — 40 secondes
   ========================================================= */
const TOTAL = 40000;

const SCENES = [
  { id:'s1', start:0,     end:5000  },
  { id:'s2', start:5000,  end:12000 },
  { id:'s3', start:12000, end:20000 },
  { id:'s4', start:20000, end:30000 },
  { id:'s5', start:30000, end:36000 },
  { id:'s6', start:36000, end:40000 }
];

/* Voix off + texte à l'écran, synchronisés */
const VO = [
  { t:0,     text:"Et si votre projet de rénovation devenait enfin réalité ?",
    caption:"Votre maison mérite le meilleur." },
  { t:5000,  text:"Fred Rénovation vous accompagne pour transformer votre habitat avec professionnalisme et savoir-faire." },
  { t:12000, text:"De la rénovation complète aux finitions les plus exigeantes, chaque détail compte." },
  { t:20000, text:"Des résultats durables, des matériaux de qualité et un accompagnement personnalisé." },
  { t:30000, text:"Des dizaines de clients nous font déjà confiance pour leurs projets." },
  { t:36000, text:"Fred Rénovation. Donnez une nouvelle vie à votre maison." }
];

/* =========================================================
   ÉTAT
   ========================================================= */
let playing = false;
let startTime = 0;
let rafId = null;
let timers = [];
let audioCtx = null, musicNodes = [], sfxGain = null;
let recorder = null, chunks = [], stream = null;

const $ = s => document.querySelector(s);
const stage = $('#stage');
const captionEl = $('#caption');
const progressEl = $('#progress');
const playBtn = $('#play');
const recBtn = $('#rec');
const recDot = $('#rec-dot');

/* =========================================================
   AUDIO — musique de fond (Web Audio API, synthèse)
   ========================================================= */
function initAudio(){
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playMusic(){
  initAudio();
  const master = audioCtx.createGain();
  master.gain.value = 0.06;          // volume de fond discret
  master.connect(audioCtx.destination);

  // Nappe harmonique (accords warm : Fmaj7 → Cmaj → Am7 → G)
  const chords = [
    [174.61, 220.00, 261.63, 329.63], // F
    [130.81, 164.81, 196.00, 261.63], // C
    [110.00, 130.81, 164.81, 220.00], // Am
    [ 98.00, 123.47, 146.83, 196.00]  // G
  ];
  const now = audioCtx.currentTime;
  const totalChords = chords.length;
  const durPerChord = TOTAL / 1000 / totalChords;

  chords.forEach((chord, ci) => {
    chord.forEach((freq, fi) => {
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      const t0 = now + ci * durPerChord;
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(0.9 / (fi + 1.5), t0 + 0.6);
      g.gain.linearRampToValueAtTime(0, t0 + durPerChord + 0.4);
      osc.connect(g); g.connect(master);
      osc.start(t0);
      osc.stop(t0 + durPerChord + 0.5);
      musicNodes.push(osc);
    });
  });

  // Léger pad rythmique (pulsation douce)
  for (let i = 0; i < TOTAL / 2000; i++){
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.value = 65.41; // C2
    const t0 = now + i * 2;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(0.25, t0 + 0.05);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + 1.6);
    osc.connect(g); g.connect(master);
    osc.start(t0); osc.stop(t0 + 1.8);
  }
}

function stopMusic(){
  musicNodes.forEach(o => { try{ o.stop(); }catch(e){} });
  musicNodes = [];
}

/* =========================================================
   BRUITAGES — synthèse bruit blanc filtré
   ========================================================= */
function playSfx(type){
  initAudio();
  const dur = type === 'saw' ? 1.4 : 0.35;
  const buffer = audioCtx.createBuffer(1, audioCtx.sampleRate * dur, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;

  const src = audioCtx.createBufferSource();
  src.buffer = buffer;

  const filt = audioCtx.createBiquadFilter();
  filt.type = 'bandpass';
  filt.frequency.value = type === 'saw' ? 1800 : 900;
  filt.Q.value = type === 'saw' ? 6 : 1.5;

  const g = audioCtx.createGain();
  g.gain.setValueAtTime(type === 'saw' ? 0.10 : 0.18, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);

  src.connect(filt); filt.connect(g); g.connect(audioCtx.destination);
  src.start();
  src.stop(audioCtx.currentTime + dur);
}

/* =========================================================
   VOIX OFF — Web Speech API (fr-FR)
   ========================================================= */
let voicesLoaded = false;
function pickFrenchVoice(){
  const voices = speechSynthesis.getVoices();
  // Priorité : voix masculine française si disponible
  const fr = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith('fr'));
  const male = fr.find(v => /paul|thomas|male|homme|google.*français/i.test(v.name));
  return male || fr[0] || voices[0];
}

function speak(text){
  if (!('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'fr-FR';
  u.rate = 0.95;
  u.pitch = 0.9;
  u.volume = 1;
  const v = pickFrenchVoice();
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}

function stopSpeak(){
  if ('speechSynthesis' in window) speechSynthesis.cancel();
}

/* =========================================================
   CONTRÔLE DES SCÈNES
   ========================================================= */
function showScene(id){
  document.querySelectorAll('.scene').forEach(s => s.classList.remove('active'));
  const el = document.getElementById(id);
  if (el) el.classList.add('active');

  // déclencheurs spécifiques
  if (id === 's3'){
    document.querySelectorAll('#s3 .card').forEach((c,i)=>{
      setTimeout(()=>c.classList.add('show'), i*450);
    });
  }
  if (id === 's4'){
    const ba = $('#ba');
    ba.classList.remove('play');
    // force reflow
    void ba.offsetWidth;
    setTimeout(()=>ba.classList.add('play'), 300);
  }
  if (id === 's6'){
    const logo = $('#logo');
    logo.classList.remove('show');
    void logo.offsetWidth;
    setTimeout(()=>logo.classList.add('show'), 200);
  }
}

function showCaption(text){
  if (!text){ captionEl.classList.remove('show'); return; }
  captionEl.textContent = text;
  captionEl.classList.add('show');
}

/* =========================================================
   LECTURE DU SPOT
   ========================================================= */
function startSpot(){
  if (playing) return;
  playing = true;
  playBtn.disabled = true;
  recBtn.disabled = false;

  initAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();

  // précharger les voix
  if ('speechSynthesis' in window){
    speechSynthesis.getVoices();
    voicesLoaded = true;
  }

  startTime = performance.now();
  playMusic();

  // programmer chaque scène
  SCENES.forEach(s => {
    timers.push(setTimeout(()=>showScene(s.id), s.start));
  });

  // programmer voix off + textes
  VO.forEach(v => {
    if (v.t === 0){
      setTimeout(()=>{ speak(v.text); showCaption(v.caption); }, 400);
    } else {
      timers.push(setTimeout(()=>{
        speak(v.text);
        showCaption(v.caption || '');
      }, v.t));
    }
  });

  // bruitages chantier scène 2
  for (let t = 5000; t < 12000; t += 1400){
    timers.push(setTimeout(()=>playSfx(t % 2800 < 1400 ? 'saw' : 'hammer'), t));
  }

  // fin
  timers.push(setTimeout(()=>{ showCaption(''); stopSpeak(); }, TOTAL));

  rafId = requestAnimationFrame(loopProgress);
}

function loopProgress(){
  if (!playing) return;
  const elapsed = performance.now() - startTime;
  const p = Math.min(100, elapsed / TOTAL * 100);
  progressEl.style.width = p + '%';
  if (elapsed < TOTAL){
    rafId = requestAnimationFrame(loopProgress);
  } else {
    finishSpot();
  }
}

function finishSpot(){
  playing = false;
  cancelAnimationFrame(rafId);
  playBtn.disabled = false;
  playBtn.textContent = '↻ Rejouer le spot';
  if (recorder && recorder.state === 'recording'){
    recorder.stop();
  }
  // laisser la scène 6 affichée
}

function resetSpot(){
  stopSpeak();
  stopMusic();
  timers.forEach(clearTimeout); timers = [];
  playing = false;
  cancelAnimationFrame(rafId);
  progressEl.style.width = '0%';
  showCaption('');
  showScene('s1');
  $('#ba').classList.remove('play');
  $('#logo').classList.remove('show');
  document.querySelectorAll('#s3 .card').forEach(c=>c.classList.remove('show'));
}

/* =========================================================
   ENREGISTREMENT VIDÉO (MediaRecorder — capture du canvas DOM)
   =========================================================
   On capture le DOM via html2canvas n'est pas dispo ici sans CDN.
   Solution sans dépendance : on capture via getDisplayMedia (l'utilisateur
   choisit l'onglet) OU on enregistre seulement l'audio + on laisse
   l'utilisateur filmer l'écran. Ici : getDisplayMedia → enregistrement .webm.
   ========================================================= */
async function startRecording(){
  try {
    stream = await navigator.mediaDevices.getDisplayMedia({
      video: { frameRate: 60 },
      audio: false
    });
    // ajouter l'audio du spot au flux
    const audioDest = audioCtx.createMediaStreamDestination();
    // connecter une copie de la musique : on recrée un gain relié au recorder
    // (plus simple : rejouer la musique vers les deux destinations)
    recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
    chunks = [];
    recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    recorder.onstop = () => {
      const blob = new Blob(chunks, { type: 'video/webm' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'fred-renovation-spot-40s.webm';
      a.click();
      URL.revokeObjectURL(url);
      recDot.classList.remove('on');
    };
    recorder.start();
    recDot.classList.add('on');

    // relancer le spot
    resetSpot();
    setTimeout(startSpot, 300);
  } catch(e){
    alert("Pour enregistrer : autorisez le partage d'onglet, puis relancez. (Le spot se jouera automatiquement.)");
  }
}

/* =========================================================
   ÉVÉNEMENTS
   ========================================================= */
playBtn.addEventListener('click', ()=>{
  resetSpot();
  setTimeout(startSpot, 200);
});

recBtn.addEventListener('click', startRecording);

window.addEventListener('keydown', e=>{
  if (e.code === 'Space'){ e.preventDefault(); if (!playing){ resetSpot(); setTimeout(startSpot, 200); } }
  if (e.code === 'KeyR'){ resetSpot(); }
});

// Préchargement des voix
if ('speechSynthesis' in window){
  speechSynthesis.onvoiceschanged = () => { voicesLoaded = true; };
}

// Petite aide affichée au démarrage
showScene('s1');
</script>
</body>
</html>
